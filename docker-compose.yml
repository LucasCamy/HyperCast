# Linux host deployment; Docker Desktop host networking must be explicitly enabled.
services:
  livekit:
    image: hypercast-sfu:1.13.9-1
    build:
      context: .
      dockerfile: infra/sfu/Dockerfile
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Run tools/init_env.py}: ${LIVEKIT_API_SECRET:?Run tools/init_env.py}"
      HYPERCAST_MAX_PUBLISHERS: "${HYPERCAST_MAX_PUBLISHERS:-3}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  healthcheck:
    image: curlimages/curl:8.17.0
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8100/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on: [livekit]

