[package]
name = "hypercast"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Windows GPU screen capture for a centralized LiveKit SFU"
license = "MIT"

[features]
default = []
# Opt-in until the hardware encode bridge is implemented (step 3).
livekit-network = ["dep:livekit", "dep:tokio", "dep:url", "dep:tokio-stream"]
nvenc = ["dep:cc"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
livekit = { version = "=0.9.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }
url = { version = "2.5", optional = true }
tokio-stream = { version = "0.1", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_System_Threading", "Win32_Security"
] }

[profile.release]
lto = "thin"
codegen-units = 1

