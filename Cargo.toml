[package]
name = "hypercast"
version = "0.8.11"
edition = "2024"
rust-version = "1.92"
description = "Native Windows and Linux screen sharing through a centralized LiveKit SFU"
license = "MIT"

[features]
default = []
# Native network/encoder modules may also be built without the desktop UI.
livekit-network = ["dep:livekit", "dep:tokio", "dep:url", "dep:tokio-stream", "dep:log"]
nvenc = ["dep:cc"]
desktop = ["nvenc", "livekit-network", "dep:eframe", "dep:raw-window-handle", "dep:reqwest", "dep:serde_json", "dep:uuid", "dep:sha2", "dep:semver", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:ashpd"]

[dependencies]
sha2 = { version = "=0.10.9", optional = true }
semver = { version = "=1.0.28", optional = true }
anyhow = "1.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "native-tls", "json"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
log = { version = "0.4", optional = true }
clap = { version = "4.5", features = ["derive"] }
livekit = { version = "=0.9.4", features = ["native-tls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }
url = { version = "2.5", optional = true }
tokio-stream = { version = "0.1", optional = true }

eframe = { version = "=0.35.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"], optional = true }
raw-window-handle = { version = "0.6", optional = true }


[build-dependencies]
cc = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "=0.24.3", optional = true }
gstreamer-app = { version = "=0.24.2", optional = true }
gstreamer-video = { version = "=0.24.3", optional = true }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screencast"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
libwebrtc = { path = "vendor/libwebrtc" }
livekit = { path = "vendor/livekit" }

