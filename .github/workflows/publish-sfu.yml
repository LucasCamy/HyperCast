name: Publish SFU image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build tested SFU
        env:
          IMAGE: ghcr.io/lucascamy/hypercast-sfu
          REVISION: ${{ github.sha }}
        run: docker build --platform linux/amd64 -f infra/sfu/Dockerfile -t "$IMAGE:sha-$REVISION" .
      - name: Publish immutable revision
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ghcr.io/lucascamy/hypercast-sfu
          REVISION: ${{ github.sha }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:sha-$REVISION"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-$REVISION" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
