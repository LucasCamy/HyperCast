# TURN restricted to the co-located HyperCast SFU. No Internet/P2P relay.
listening-ip=192.168.15.19
relay-ip=192.168.15.19
tls-listening-port=5349
min-port=8110
max-port=8209
# No external-ip: only the co-located SFU reaches the private relay addresses.
# WAN forwarding is needed for TLS 5349, not for the internal relay range.
realm=turn.hypercast.cloudlane.com.br
server-name=turn.hypercast.cloudlane.com.br
use-auth-secret
static-auth-secret=@TURN_SECRET@
cert=/etc/turn-tls/tls.crt
pkey=/etc/turn-tls/tls.key
no-udp
no-tcp
no-dtls
no-tcp-relay
no-tlsv1
no-tlsv1_1
no-cli
no-multicast-peers
no-rfc5780
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=192.168.15.19
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
user-quota=8
total-quota=96
max-bps=20000000
bps-capacity=100000000
stale-nonce=600
fingerprint
relay-threads=2
log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
